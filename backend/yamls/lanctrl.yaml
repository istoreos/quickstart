definitions:
  DeviceManagementCapability:
    type: object
    required:
      - state
    properties:
      state:
        type: string
        enum: [available, disabled, not_installed, error]
      reason:
        type: string
  DeviceManagementCapabilities:
    type: object
    properties:
      speedLimit:
        $ref: "#/definitions/DeviceManagementCapability"
      floatGateway:
        $ref: "#/definitions/DeviceManagementCapability"
  LANDhcpGlobalConfig:
    type: object
    properties:
      dhcpEnabled:
        type: boolean
      dhcpGateway:
        type: string
        description: "DHCP 网关"
      gatewaySels:
        type: array
        items:
          $ref: '#/definitions/LANDhcpGatewaySel'
  LANDhcpGatewaySel:
    type: object
    properties:
     title:
       type: string
       description: "显示标题。比如 default: 默认网关 parent: 上级路由 myself: 本设备 bypass: 旁路由 floatip: 浮动网关"
     gateway:
       type: string
       description: "具体的网关IP"
  LANCtrlSpeedLimitModule:
    type: object
    properties:
      installed:
        type: boolean
      enabled:
        type: boolean
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer

  LANCtrlDhcpTagInfo:
    type: object
    properties:
      tagTitle:
        type: string
        description: "展示标题，需要在前段把英文翻译成中文"
      tagName:
        type: string
        description: "标签值，提交的时候用这个值"
      autoCreated:
        type: boolean
        description: "系统自动生成，不能删除"
      gateway:
        type: string
        description: "如果是咱们自定义的设备，则返回网关信息"
      lanName:
        type: string
        description: "比如 LAN, LAN2, LAN3 等局域网接口"
      dhcpOption:
        type: array
        items:
          type: string
        description: "['3,192.168.100.3','6,192.168.100.3']"

  LANCtrlFloatGatewayModule:
    type: object
    properties:
      installed:
        type: boolean
      enabled:
        type: boolean
      role:
        type: string
      setIP:
        type: string
      checkIP:
        type: string
      checkUrl:
        type: string
      checkUrlTimeout:
        type: integer

  LANCtrlDhcpTags:
    type: array
    items:
      $ref: "#/definitions/LANCtrlDhcpTagInfo"
        
  LANCtrlGlobalConfig:
    type: object
    properties:
      capabilities:
        $ref: "#/definitions/DeviceManagementCapabilities"
      dhcpGlobal:
        $ref: "#/definitions/LANDhcpGlobalConfig"
      dhcpTags:
        $ref: "#/definitions/LANCtrlDhcpTags"
      floatGateway:
        $ref: "#/definitions/LANCtrlFloatGatewayModule"
      speedLimit:
        $ref: "#/definitions/LANCtrlSpeedLimitModule"
  
  LANCtrlGlobalConfigResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        $ref: "#/definitions/LANCtrlGlobalConfig"
  
  LANStaticAssigned:
    type: object
    properties:
      hostname:
        type: string
      assignedIP:
        type: string
      assignedMac:
        type: string
      bindIP:
        type: boolean
        description: "请求数据的时候有用，是否启用 mac/ip 绑定"
      tagTitle:
        type: string
        description: "标签名字，如果标签名字为空，则展示标签值。需要前端把标签英文名字变成中文"
      tagName:
        type: string
        description: "标签名"
      dhcpGateway:
        type: string
        description: "网关信息"
      action:
        type: string
        description: "modify|delete|add"

  LANCtrlDhcpTagConfigRequest:
    type: object
    properties:
      action:
        type: string
        description: "modify|delete|add"
      tagTitle:
        type: string
        description: "标签"
      tagName:
        type: string
        description: "标签名"
      dhcpOption:
        type: array
        items:
          type: string
        description: "['3,192.168.100.3','6,192.168.100.3']"

  LANDevice:
    type: object
    properties:
      hostname:
        type: string
        description: "设备名称"
      hostImg:
        type: string
        description: "设备对应的图片"
      ip:
        type: string
        description: "设备IP地址"
      mac:
        type: string
        description: "设备MAC地址"
      vendor:
        type: string
        description: "设备厂商"
      intr:
        type: string
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer
      uploadSpeedStr:
        type: string
        description: "上传速度的人类可读格式"
      downloadSpeedStr:
        type: string
        description: "下载速度的人类可读格式"
      staticAssigned:
        $ref: "#/definitions/LANStaticAssigned"
      speedLimit:
        $ref: "#/definitions/LANCtrlSpeedLimitItem"
      
  LANDevices:
    type: array
    items:
      $ref: "#/definitions/LANDevice"
  
  LANDeviceResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          devices:
            $ref: "#/definitions/LANDevices"
          dhcpTags:
            $ref: "#/definitions/LANCtrlDhcpTags"

  LANCtrlStaticAssignedResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: array
        items:
          $ref: "#/definitions/LANStaticAssigned"
  
  LANCtrlSpeedLimitItem:
    type: object
    properties:
      ip:
        type: string
        description: "基于IP进行限速"
      mac:
        type: string
        description: "基于MAC进行限速"
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer
      networkAccess:
        type: boolean
        description: "是否能访问网络"
      comment:
        type: string
        description: "注解"
      enabled:
        type: boolean
        description: "是否启用"
      action:
        type: string
        description: "modify|delete|add"
      hostname:
        type: string
        description: "设备名称"
  
  LANCtrlSpeedLimitResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: array
        items:
          $ref: "#/definitions/LANCtrlSpeedLimitItem" 
  
  LANCtrlSpeedLimitRequest:
    type: object
    properties:
      ip:
        type: string
        description: "基于IP进行限速"
      mac:
        type: string
        description: "基于MAC进行限速"

  SpeedsForOneDeviceRequest:
    type: object
    properties:
      ip:
        type: string
        description: "设备的IP地址"

  LANCtrlDhcpGatewayConfigRequest:
    type: object
    properties:
      dhcpEnabled:
        type: boolean
        description: "是否启用 DHCP"
      dhcpGateway:
        type: string
        description: "DHCP 网关地址"

  DeviceSpeedStat:
    type: object
    properties:
      ip:
        type: string
        description: "设备的IP地址"
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer
      uploadSpeedStr:
        type: string
        description: "上传速度的人类可读格式"
      downloadSpeedStr:
        type: string
        description: "下载速度的人类可读格式"

  DeviceSpeedStatsResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: array
        items:
          $ref: "#/definitions/DeviceSpeedStat"

  DeviceInventoryAddress:
    type: object
    required: [family, address]
    properties:
      family:
        type: integer
      address:
        type: string
      primary:
        type: boolean
  DeviceInventoryAddresses:
    type: object
    properties:
      current:
        type: array
        items:
          $ref: "#/definitions/DeviceInventoryAddress"
      historical:
        type: array
        items:
          $ref: "#/definitions/DeviceInventoryAddress"
  DeviceInventoryConnection:
    type: object
    properties:
      kind:
        type: string
        enum: [lan, wifi, unknown]
  DeviceInventoryIdentity:
    type: object
    required: [kind, scope]
    properties:
      kind:
        type: string
        enum: [mac, duid_iaid]
      scope:
        type: string
        enum: [persistent, boot]
  DeviceInventoryHealth:
    type: object
    properties:
      state:
        type: string
        enum: [ready, partial, warming_up, stale]
      reasons:
        type: array
        items:
          type: string
  DeviceClassification:
    type: object
    required: [category, source, confidence]
    properties:
      brand:
        type: string
      manufacturer:
        type: string
      category:
        type: string
        enum: [phone, computer, tablet, tv, network, smart-home, camera, gaming, storage, printer, wearable]
      source:
        type: string
        enum: [model, hostname, manufacturer_default, fallback, manual]
      confidence:
        type: string
        enum: [high, medium, low]
  DeviceInventoryItem:
    type: object
    required: [deviceId, online, lastSeenAt, mac, identity, addresses, connection, classification]
    properties:
      deviceId:
        type: string
      displayName:
        type: string
      hostname:
        type: string
      online:
        type: boolean
      lastSeenAt:
        type: string
      mac:
        type: string
      vendor:
        type: string
      classification:
        $ref: "#/definitions/DeviceClassification"
      identity:
        $ref: "#/definitions/DeviceInventoryIdentity"
      addresses:
        $ref: "#/definitions/DeviceInventoryAddresses"
      connection:
        $ref: "#/definitions/DeviceInventoryConnection"
  DeviceInventoryResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          devices:
            type: array
            items:
              $ref: "#/definitions/DeviceInventoryItem"
          health:
            $ref: "#/definitions/DeviceInventoryHealth"
  DeviceClassificationOverride:
    type: object
    required: [active, scope]
    properties:
      active: { type: boolean }
      category: { type: string }
      scope:
        type: string
        enum: [persistent, boot]
  DeviceClassificationResult:
    type: object
    required: [deviceId, changed]
    properties:
      deviceId: { type: string }
      classification:
        $ref: "#/definitions/DeviceClassification"
      override:
        $ref: "#/definitions/DeviceClassificationOverride"
      changed: { type: boolean }
      error:
        $ref: "#/definitions/DevicePolicyError"
  DeviceClassificationResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        $ref: "#/definitions/DeviceClassificationResult"
  DeviceClassificationApplyRequest:
    type: object
    required: [deviceId, action]
    properties:
      deviceId: { type: string }
      action:
        type: string
        enum: [set, reset]
      category: { type: string }
  DeviceTrafficItem:
    type: object
    required: [deviceId, uploadSpeed, downloadSpeed, uploadBytes, downloadBytes, connectionCount, state]
    properties:
      deviceId:
        type: string
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer
      uploadBytes:
        type: integer
      downloadBytes:
        type: integer
      connectionCount:
        type: integer
      state:
        type: string
        enum: [warming_up, ready, stale, partial]
      sampledAt:
        type: string
  DeviceTrafficResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/definitions/DeviceTrafficItem"
          health:
            $ref: "#/definitions/DeviceInventoryHealth"
  DevicePolicyCapability:
    type: object
    required: [state]
    properties:
      state:
        type: string
        enum: [available, disabled, not_installed, error]
      reason:
        type: string
  DeviceStaticPolicy:
    type: object
    properties:
      enabled: { type: boolean }
      assignedIP: { type: string }
      bindIP: { type: boolean }
      hostname: { type: string }
      tagName: { type: string }
      tagTitle: { type: string }
  DeviceSpeedPolicy:
    type: object
    properties:
      enabled: { type: boolean }
      uploadSpeed: { type: integer }
      downloadSpeed: { type: integer }
  DeviceAccessPolicy:
    type: object
    properties:
      networkAccess: { type: boolean }
  DevicePolicy:
    type: object
    properties:
      deviceId: { type: string }
      displayName: { type: string }
      mac: { type: string }
      currentIPv4: { type: string }
      static:
        $ref: "#/definitions/DeviceStaticPolicy"
      speed:
        $ref: "#/definitions/DeviceSpeedPolicy"
      access:
        $ref: "#/definitions/DeviceAccessPolicy"
      capabilities:
        type: object
        additionalProperties:
          $ref: "#/definitions/DevicePolicyCapability"
  DevicePolicyError:
    type: object
    properties:
      code:
        type: string
        enum: [dependency_not_installed, conflict, validation_failed, apply_failed]
      message: { type: string }
  DevicePolicyResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          policy:
            $ref: "#/definitions/DevicePolicy"
          changed: { type: boolean }
          error:
            $ref: "#/definitions/DevicePolicyError"
  DevicePolicyApplyRequest:
    type: object
    required: [deviceId, kind]
    properties:
      deviceId: { type: string }
      kind:
        type: string
        enum: [static, speed, access]
      idempotencyKey: { type: string }
      static:
        $ref: "#/definitions/DeviceStaticPolicy"
      speed:
        $ref: "#/definitions/DeviceSpeedPolicy"
      access:
        $ref: "#/definitions/DeviceAccessPolicy"
  DevicePolicyRulesResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          static:
            type: array
            items:
              $ref: "#/definitions/LANStaticAssigned"
          speed:
            type: array
            items:
              $ref: "#/definitions/LANCtrlSpeedLimitItem"
