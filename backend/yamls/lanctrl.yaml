definitions:
  TaskTransaction:
    type: object
    required: [task, stage, status]
    properties:
      task: { type: string, enum: [profile, network, restrictions] }
      idempotencyKey: { type: string, maxLength: 128 }
      stage: { type: string, enum: [plan, validate, snapshot, apply, verify, rollback, recover] }
      status: { type: string, enum: [in_progress, committed, unchanged, rejected, failed, rolled_back, recovery_required] }
      replayed: { type: boolean }
      recoveryAction: { type: string }
  DeviceManagementCapability:
    type: object
    required:
      - state
    properties:
      state:
        type: string
        enum: [available, disabled, not_installed, unsupported, error]
      reason:
        type: string
      desiredRetained:
        type: boolean
      actions:
        type: array
        items:
          type: object
          properties:
            kind: { type: string, enum: [install, enable, retry] }
            target: { type: string }
            requiresConfirmation: { type: boolean }
  DeviceManagementCapabilities:
    type: object
    properties:
      items:
        type: object
        additionalProperties:
          $ref: "#/definitions/DeviceManagementCapability"
      internetAccess:
        $ref: "#/definitions/DeviceManagementCapability"
      speedLimit:
        $ref: "#/definitions/DeviceManagementCapability"
      floatGateway:
        $ref: "#/definitions/DeviceManagementCapability"
      trafficInsights:
        $ref: "#/definitions/DeviceManagementCapability"
  RouterContextEvidence:
    type: object
    properties:
      kind: { type: string }
      source: { type: string }
      value: { type: string }
      confidence: { type: string, enum: [configured, observed] }
  RouteEditability:
    type: object
    required: [editable, reason]
    properties:
      editable: { type: boolean }
      reason: { type: string }
      guidance: { type: string }
  RouterContext:
    type: object
    required: [lan, topologyPosition, dhcpAuthority, routeEditability]
    properties:
      lan: { type: string }
      topologyPosition: { type: string, enum: [lan_gateway_candidate, downstream_router, ambiguous, unknown] }
      localAddress: { type: string }
      upstreamGateways: { type: array, items: { type: string } }
      localDhcpConfigured: { type: boolean }
      localDhcpHealthy: { type: boolean }
      dhcpAuthority: { type: string, enum: [local, external_observed, none_detected, ambiguous, error] }
      externalDhcpServers: { type: array, items: { type: string } }
      routeEditability: { $ref: "#/definitions/RouteEditability" }
      evidence: { type: array, items: { $ref: "#/definitions/RouterContextEvidence" } }
  RouterContextResponse:
    allOf:
      - $ref: "common.yaml#/definitions/SDKNormalResponse"
      - type: object
        properties:
          result: { $ref: "#/definitions/RouterContext" }
  LANDhcpGlobalConfig:
    type: object
    properties:
      dhcpEnabled:
        type: boolean
      dhcpGateway:
        type: string
        description: "DHCP 网关"
      gatewaySels:
        type: array
        items:
          $ref: '#/definitions/LANDhcpGatewaySel'
  LANDhcpGatewaySel:
    type: object
    properties:
     title:
       type: string
       description: "显示标题。比如 default: 默认网关 parent: 上级路由 myself: 本设备 bypass: 旁路由 floatip: 浮动网关"
     gateway:
       type: string
       description: "具体的网关IP"
  LANCtrlSpeedLimitModule:
    type: object
    properties:
      installed:
        type: boolean
      enabled:
        type: boolean
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer

  LANCtrlDhcpTagInfo:
    type: object
    properties:
      tagTitle:
        type: string
        description: "展示标题，需要在前段把英文翻译成中文"
      tagName:
        type: string
        description: "标签值，提交的时候用这个值"
      autoCreated:
        type: boolean
        description: "系统自动生成，不能删除"
      gateway:
        type: string
        description: "如果是咱们自定义的设备，则返回网关信息"
      lanName:
        type: string
        description: "比如 LAN, LAN2, LAN3 等局域网接口"
      dhcpOption:
        type: array
        items:
          type: string
        description: "['3,192.168.100.3','6,192.168.100.3']"

  LANCtrlFloatGatewayModule:
    type: object
    properties:
      installed:
        type: boolean
      enabled:
        type: boolean
      role:
        type: string
      setIP:
        type: string
      checkIP:
        type: string
      checkUrl:
        type: string
      checkUrlTimeout:
        type: integer

  LANCtrlDhcpTags:
    type: array
    items:
      $ref: "#/definitions/LANCtrlDhcpTagInfo"
        
  LANCtrlGlobalConfig:
    type: object
    properties:
      capabilities:
        $ref: "#/definitions/DeviceManagementCapabilities"
      dhcpGlobal:
        $ref: "#/definitions/LANDhcpGlobalConfig"
      dhcpTags:
        $ref: "#/definitions/LANCtrlDhcpTags"
      floatGateway:
        $ref: "#/definitions/LANCtrlFloatGatewayModule"
      speedLimit:
        $ref: "#/definitions/LANCtrlSpeedLimitModule"
  
  LANCtrlGlobalConfigResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        $ref: "#/definitions/LANCtrlGlobalConfig"
  
  LANStaticAssigned:
    type: object
    properties:
      hostname:
        type: string
      assignedIP:
        type: string
      assignedMac:
        type: string
      bindIP:
        type: boolean
        description: "请求数据的时候有用，是否启用 mac/ip 绑定"
      tagTitle:
        type: string
        description: "标签名字，如果标签名字为空，则展示标签值。需要前端把标签英文名字变成中文"
      tagName:
        type: string
        description: "标签名"
      dhcpGateway:
        type: string
        description: "网关信息"
      action:
        type: string
        description: "modify|delete|add"

  LANCtrlDhcpTagConfigRequest:
    type: object
    properties:
      action:
        type: string
        description: "modify|delete|add"
      tagTitle:
        type: string
        description: "标签"
      tagName:
        type: string
        description: "标签名"
      dhcpOption:
        type: array
        items:
          type: string
        description: "['3,192.168.100.3','6,192.168.100.3']"

  LANDevice:
    type: object
    properties:
      hostname:
        type: string
        description: "设备名称"
      hostImg:
        type: string
        description: "设备对应的图片"
      ip:
        type: string
        description: "设备IP地址"
      mac:
        type: string
        description: "设备MAC地址"
      vendor:
        type: string
        description: "设备厂商"
      intr:
        type: string
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer
      uploadSpeedStr:
        type: string
        description: "上传速度的人类可读格式"
      downloadSpeedStr:
        type: string
        description: "下载速度的人类可读格式"
      staticAssigned:
        $ref: "#/definitions/LANStaticAssigned"
      speedLimit:
        $ref: "#/definitions/LANCtrlSpeedLimitItem"
      
  LANDevices:
    type: array
    items:
      $ref: "#/definitions/LANDevice"
  
  LANDeviceResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          devices:
            $ref: "#/definitions/LANDevices"
          dhcpTags:
            $ref: "#/definitions/LANCtrlDhcpTags"

  LANCtrlStaticAssignedResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: array
        items:
          $ref: "#/definitions/LANStaticAssigned"
  
  LANCtrlSpeedLimitItem:
    type: object
    properties:
      ip:
        type: string
        description: "基于IP进行限速"
      mac:
        type: string
        description: "基于MAC进行限速"
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer
      networkAccess:
        type: boolean
        description: "是否能访问网络"
      comment:
        type: string
        description: "注解"
      enabled:
        type: boolean
        description: "是否启用"
      action:
        type: string
        description: "modify|delete|add"
      hostname:
        type: string
        description: "设备名称"
  
  LANCtrlSpeedLimitResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: array
        items:
          $ref: "#/definitions/LANCtrlSpeedLimitItem" 
  
  LANCtrlSpeedLimitRequest:
    type: object
    properties:
      ip:
        type: string
        description: "基于IP进行限速"
      mac:
        type: string
        description: "基于MAC进行限速"

  SpeedsForOneDeviceRequest:
    type: object
    properties:
      ip:
        type: string
        description: "设备的IP地址"

  LANCtrlDhcpGatewayConfigRequest:
    type: object
    properties:
      dhcpEnabled:
        type: boolean
        description: "是否启用 DHCP"
      dhcpGateway:
        type: string
        description: "DHCP 网关地址"

  DeviceSpeedStat:
    type: object
    properties:
      ip:
        type: string
        description: "设备的IP地址"
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer
      uploadSpeedStr:
        type: string
        description: "上传速度的人类可读格式"
      downloadSpeedStr:
        type: string
        description: "下载速度的人类可读格式"

  DeviceSpeedStatsResponse:
    type: object
    allOf: 
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: array
        items:
          $ref: "#/definitions/DeviceSpeedStat"

  DeviceInventoryAddress:
    type: object
    required: [family, address]
    properties:
      family:
        type: integer
      address:
        type: string
      primary:
        type: boolean
  DeviceInventoryAddresses:
    type: object
    properties:
      current:
        type: array
        items:
          $ref: "#/definitions/DeviceInventoryAddress"
      historical:
        type: array
        items:
          $ref: "#/definitions/DeviceInventoryAddress"
  DeviceInventoryConnection:
    type: object
    properties:
      kind:
        type: string
        enum: [lan, wifi, unknown]
  DeviceInventoryIdentity:
    type: object
    required: [kind, scope]
    properties:
      kind:
        type: string
        enum: [mac, duid_iaid]
      scope:
        type: string
        enum: [persistent, boot]
  DeviceInventoryHealth:
    type: object
    properties:
      state:
        type: string
        enum: [ready, partial, warming_up, stale]
      reasons:
        type: array
        items:
          type: string
  DeviceClassification:
    type: object
    required: [category, source, confidence]
    properties:
      brand:
        type: string
      manufacturer:
        type: string
      category:
        type: string
        enum: [phone, computer, tablet, tv, network, smart-home, camera, gaming, storage, printer, wearable]
      source:
        type: string
        enum: [model, hostname, manufacturer_default, fallback, manual]
      confidence:
        type: string
        enum: [high, medium, low]
  DeviceInventoryItem:
    type: object
    required: [deviceId, online, presenceState, lastSeenAt, mac, identity, addresses, connection, classification, icon]
    properties:
      deviceId:
        type: string
      displayName:
        type: string
      hostname:
        type: string
      online:
        type: boolean
      presenceState:
        type: string
        enum: [online, offline, never_seen]
      lastSeenAt:
        type: string
      mac:
        type: string
      vendor:
        type: string
      classification:
        $ref: "#/definitions/DeviceClassification"
      icon:
        $ref: "#/definitions/DeviceIconVisual"
      identity:
        $ref: "#/definitions/DeviceInventoryIdentity"
      addresses:
        $ref: "#/definitions/DeviceInventoryAddresses"
      connection:
        $ref: "#/definitions/DeviceInventoryConnection"
  DeviceIconVisual:
    type: object
    required: [mode, resolvedKey, assetKey, label]
    properties:
      mode: { type: string, enum: [auto, manual] }
      preferenceKey: { type: string }
      resolvedKey: { type: string }
      assetKey: { type: string }
      label: { type: string }
      brandLabel: { type: string }
  DeviceInventoryAddRequest:
    type: object
    required: [mac]
    properties:
      mac: { type: string }
      alias: { type: string, maxLength: 64 }
  DeviceInventoryResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          devices:
            type: array
            items:
              $ref: "#/definitions/DeviceInventoryItem"
          health:
            $ref: "#/definitions/DeviceInventoryHealth"
  DeviceClassificationOverride:
    type: object
    required: [active, scope]
    properties:
      active: { type: boolean }
      category: { type: string }
      scope:
        type: string
        enum: [persistent, boot]
  DeviceClassificationResult:
    type: object
    required: [deviceId, changed]
    properties:
      deviceId: { type: string }
      classification:
        $ref: "#/definitions/DeviceClassification"
      override:
        $ref: "#/definitions/DeviceClassificationOverride"
      changed: { type: boolean }
      error:
        $ref: "#/definitions/DevicePolicyError"
  DeviceClassificationResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        $ref: "#/definitions/DeviceClassificationResult"
  DeviceClassificationApplyRequest:
    type: object
    required: [deviceId, action]
    properties:
      deviceId: { type: string }
      action:
        type: string
        enum: [set, reset]
      category: { type: string }
  DeviceTrafficItem:
    type: object
    required: [deviceId, uploadSpeed, downloadSpeed, uploadBytes, downloadBytes, connectionCount, state]
    properties:
      deviceId:
        type: string
      uploadSpeed:
        type: integer
      downloadSpeed:
        type: integer
      uploadBytes:
        type: integer
      downloadBytes:
        type: integer
      connectionCount:
        type: integer
      state:
        type: string
        enum: [warming_up, ready, stale, partial]
      sampledAt:
        type: string
  DeviceTrafficResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/definitions/DeviceTrafficItem"
          health:
            $ref: "#/definitions/DeviceInventoryHealth"
  DevicePolicyCapability:
    type: object
    required: [state]
    properties:
      state:
        type: string
        enum: [available, disabled, not_installed, error]
      reason:
        type: string
  DeviceStaticPolicy:
    type: object
    properties:
      enabled: { type: boolean }
      assignedIP: { type: string }
      bindIP: { type: boolean }
      hostname: { type: string }
      tagName: { type: string }
      tagTitle: { type: string }
  DeviceSpeedPolicy:
    type: object
    properties:
      enabled: { type: boolean }
      uploadSpeed: { type: integer }
      downloadSpeed: { type: integer }
  DeviceAccessPolicy:
    type: object
    properties:
      networkAccess: { type: boolean }
  DevicePolicy:
    type: object
    properties:
      deviceId: { type: string }
      displayName: { type: string }
      mac: { type: string }
      currentIPv4: { type: string }
      static:
        $ref: "#/definitions/DeviceStaticPolicy"
      speed:
        $ref: "#/definitions/DeviceSpeedPolicy"
      access:
        $ref: "#/definitions/DeviceAccessPolicy"
      capabilities:
        type: object
        additionalProperties:
          $ref: "#/definitions/DevicePolicyCapability"
      version: { type: string }
  DevicePolicyError:
    type: object
    properties:
      code:
        type: string
        enum: [dependency_not_installed, conflict, validation_failed, apply_failed, transaction_unavailable, rolled_back, recovery_required, effect_record_failed]
      message: { type: string }
  DevicePolicyResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          policy:
            $ref: "#/definitions/DevicePolicy"
          changed: { type: boolean }
          error:
            $ref: "#/definitions/DevicePolicyError"
          transaction:
            $ref: "#/definitions/TaskTransaction"
  DevicePolicyApplyRequest:
    type: object
    required: [deviceId, kind]
    properties:
      deviceId: { type: string }
      kind:
        type: string
        enum: [static, speed, access]
      idempotencyKey: { type: string }
      expectedVersion: { type: string }
      static:
        $ref: "#/definitions/DeviceStaticPolicy"
      speed:
        $ref: "#/definitions/DeviceSpeedPolicy"
      access:
        $ref: "#/definitions/DeviceAccessPolicy"
  DeviceRestrictionPlanResponse:
    type: object
    allOf: [{ $ref: "common.yaml#/definitions/JsonResponse" }]
    properties:
      result: { type: object }
  DevicePolicyRulesResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          static:
            type: array
            items:
              $ref: "#/definitions/LANStaticAssigned"
          speed:
            type: array
            items:
              $ref: "#/definitions/LANCtrlSpeedLimitItem"
  DeviceRuntimeDiagnosticsResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        description: "Privacy-safe aggregate runtime counters; contains no device identity or address"
        properties:
          inventory: { type: object }
          traffic: { type: object }
          sampler: { type: object }
          oui: { type: object }
  DeviceProfile:
    type: object
    properties:
      deviceId: { type: string }
      alias: { type: string }
      originalHostname: { type: string }
      scope: { type: string, enum: [persistent, boot] }
      classification: { $ref: "#/definitions/DeviceClassification" }
  DeviceProfileResponse:
    type: object
    allOf:
      - $ref: "common.yaml#/definitions/JsonResponse"
    properties:
      result:
        type: object
        properties:
          profile: { $ref: "#/definitions/DeviceProfile" }
          changed: { type: boolean }
          error: { $ref: "#/definitions/DevicePolicyError" }
          transaction: { $ref: "#/definitions/TaskTransaction" }
  DeviceProfileApplyRequest:
    type: object
    required: [deviceId, action]
    properties:
      deviceId: { type: string }
      idempotencyKey: { type: string, maxLength: 128 }
      action: { type: string, enum: [patch, reset, reset_brand, reset_category, reset_icon] }
      alias: { type: string, maxLength: 64 }
      brand: { type: string, maxLength: 48 }
      category: { type: string }
      iconMode: { type: string, enum: [auto, manual] }
      iconKey: { type: string }
  GatewayTarget:
    type: object
    properties:
      id: { type: string }
      name: { type: string }
      kind: { type: string, enum: [default, self, upstream, bypass, floating, custom] }
      gateway: { type: string }
      dns: { type: array, items: { type: string } }
      supported: { type: boolean }
      reasons: { type: array, items: { type: string } }
      referenceCount: { type: integer }
      desiredState: { type: string }
      effectState: { type: string }
      version: { type: string }
  GatewayTargetListResponse:
    type: object
    allOf: [{ $ref: "common.yaml#/definitions/JsonResponse" }]
    properties:
      result:
        type: object
        properties:
          targets: { type: array, items: { $ref: "#/definitions/GatewayTarget" } }
          version: { type: string }
          health: { type: string }
  GatewayAssignmentRequest:
    type: object
    required: [action, targetId]
    properties:
      action: { type: string, enum: [assign, delete_target] }
      deviceId: { type: string }
      targetId: { type: string }
      expectedVersion: { type: string }
  GatewayAssignmentPlanResponse:
    type: object
    allOf: [{ $ref: "common.yaml#/definitions/JsonResponse" }]
    properties:
      result: { type: object }
  GatewayAssignmentApplyResponse:
    type: object
    allOf: [{ $ref: "common.yaml#/definitions/JsonResponse" }]
    properties:
      result: { type: object }
  GatewayReferencesResponse:
    type: object
    allOf: [{ $ref: "common.yaml#/definitions/JsonResponse" }]
    properties:
      result: { type: object }
  GatewayTargetMutationRequest:
    type: object
    required: [action]
    description: "Create, update, or safely replace and delete a user-facing Internet Path; DHCP implementation fields are intentionally absent"
    properties:
      action: { type: string, enum: [create, update, delete] }
      targetId: { type: string }
      name: { type: string, maxLength: 64 }
      kind: { type: string, enum: [bypass, custom] }
      gateway: { type: string }
      replacementTargetId: { type: string }
      expectedVersion: { type: string }
      idempotencyKey: { type: string, maxLength: 128 }
  GatewayTargetMutationPlanResponse:
    type: object
    allOf: [{ $ref: "common.yaml#/definitions/JsonResponse" }]
    properties:
      result: { type: object }
  GatewayTargetMutationApplyResponse:
    type: object
    allOf: [{ $ref: "common.yaml#/definitions/JsonResponse" }]
    properties:
      result: { type: object }
  DeviceAddressPolicy:
    type: object
    required: [enabled, bindIP]
    description: "User-facing address reservation; intentionally excludes internal DHCP tags"
    properties:
      enabled: { type: boolean }
      assignedIP: { type: string }
      bindIP: { type: boolean }
      hostname: { type: string, maxLength: 63 }
  DeviceInternetPath:
    type: object
    required: [targetId, effect]
    properties:
      targetId: { type: string }
      effect: { $ref: "#/definitions/PolicyEffect" }
  DesiredNetworkPolicy:
    type: object
    required: [targetId, static]
    properties:
      targetId: { type: string }
      static: { $ref: "#/definitions/DeviceAddressPolicy" }
      updatedAt: { type: string, format: date-time }
  AppliedNetworkConfiguration:
    type: object
    required: [targetId, configVersion, state]
    properties:
      targetId: { type: string }
      configVersion: { type: string }
      state: { type: string, enum: [server_applied, server_configuration_observed, apply_failed] }
      appliedAt: { type: string, format: date-time }
  ObservedNetworkEffect:
    type: object
    required: [state]
    properties:
      state: { type: string, enum: [pending_renewal, lease_observed_unverifiable, unverifiable, observation_error, failed] }
      reason: { type: string }
      source: { type: string }
      observedAt: { type: string, format: date-time }
  PolicyEffect:
    type: object
    required: [desired, applied, observed, needsAttention]
    properties:
      desired: { $ref: "#/definitions/DesiredNetworkPolicy" }
      applied: { $ref: "#/definitions/AppliedNetworkConfiguration" }
      observed: { $ref: "#/definitions/ObservedNetworkEffect" }
      needsAttention: { type: boolean }
      attentionReason: { type: string }
  DeviceNetworkPolicy:
    type: object
    required: [deviceId, static, path, targets, version]
    properties:
      deviceId: { type: string }
      static: { $ref: "#/definitions/DeviceAddressPolicy" }
      path: { $ref: "#/definitions/DeviceInternetPath" }
      targets: { type: array, items: { $ref: "#/definitions/GatewayTarget" } }
      version: { type: string }
  DeviceNetworkPolicyResponse:
    type: object
    allOf: [{ $ref: "common.yaml#/definitions/JsonResponse" }]
    properties:
      result:
        type: object
        properties:
          policy: { $ref: "#/definitions/DeviceNetworkPolicy" }
          changed: { type: boolean }
          error: { $ref: "#/definitions/DevicePolicyError" }
          transaction: { $ref: "#/definitions/TaskTransaction" }
  DeviceNetworkPolicyApplyRequest:
    type: object
    required: [deviceId, static, targetId]
    properties:
      deviceId: { type: string }
      idempotencyKey: { type: string, maxLength: 128 }
      static: { $ref: "#/definitions/DeviceAddressPolicy" }
      targetId: { type: string }
      expectedVersion: { type: string }
  DeviceNetworkPolicyPlanResponse:
    type: object
